<!DOCTYPE html>
<html>
<head>
    <title>Payment Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0505 50%, #0a0a0a 100%);
            background-attachment: fixed;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(139, 0, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(196, 30, 30, 0.1) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* --- SPIN ANIMATION --- */
        @keyframes spinLogo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header-title-container {
            display: flex;
            align-items: center; 
            justify-content: center;
            margin-bottom: 20px;
        }

        #logo-image {
            width: 60px; 
            height: 60px;
            margin-right: 15px;
            animation: spinLogo 5s linear infinite; 
            /* Added border-radius to make the image round */
            border-radius: 50%;
        }

        h1 {
            font-size: 3.5em;
            text-align: center;
            background: linear-gradient(45deg, #ff0000, #8B0000, #ff4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            animation: glow 3s ease-in-out infinite;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        h1::before {
            content: none;
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.5)); }
            50% { filter: drop-shadow(0 0 40px rgba(255, 0, 0, 0.8)); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin: 30px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Updated: Tab buttons are fully rounded */
        .tab {
            padding: 12px 30px;
            background: rgba(42, 42, 42, 0.6);
            border: 2px solid rgba(139, 0, 0, 0.3);
            border-radius: 50px; /* Fully rounded */
            color: #b0b0b0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab:hover {
            background: rgba(139, 0, 0, 0.2);
            border-color: #ff0000;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.3);
        }

        .tab.active {
            background: linear-gradient(135deg, #8B0000, #c41e1e);
            border-color: #ff0000;
            color: white;
            box-shadow: 0 5px 25px rgba(255, 0, 0, 0.4);
        }

        .section {
            display: none;
            animation: fadeInUp 0.6s ease-out;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Updated: Card corners are rounded (15px -> 30px) */
        .card {
            background: rgba(42, 42, 42, 0.8);
            padding: 30px;
            border-radius: 30px; 
            box-shadow: 
                0 8px 32px rgba(139, 0, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(139, 0, 0, 0.3);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .card:hover {
            box-shadow: 
                0 12px 48px rgba(139, 0, 0, 0.6),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
        }

        label {
            display: block;
            color: #ff6b6b;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Updated: Input and select fields are fully rounded */
        input, select {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 2px solid rgba(139, 0, 0, 0.3);
            border-radius: 50px; /* Fully rounded */
            background: rgba(26, 26, 26, 0.8);
            color: #e0e0e0;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            transform: scale(1.02);
            background: rgba(26, 26, 26, 1);
        }

        /* Button is already fully rounded (50px) */
        button {
            background: linear-gradient(135deg, #8B0000, #c41e1e);
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 25px rgba(139, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(255, 0, 0, 0.6);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .payment-list {
            display: grid;
            gap: 20px;
            margin-top: 20px;
        }

        /* Updated: Payment items are rounded (15px -> 30px) */
        .payment-item {
            background: rgba(42, 42, 42, 0.8);
            padding: 25px;
            border-radius: 30px; 
            border: 1px solid rgba(139, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .payment-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 0, 0.1), transparent);
            transition: left 0.5s;
        }

        .payment-item:hover::before {
            left: 100%;
        }

        .payment-item:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 
                0 15px 50px rgba(139, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border-color: #ff0000;
        }

        .payment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .payment-id {
            font-size: 1.5em;
            color: #ff4444;
            font-weight: bold;
        }

        /* Updated: Status badges are fully rounded (20px) */
        .status-badge {
            padding: 8px 20px;
            border-radius: 50px; /* Fully rounded */
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: successPop 0.5s ease-out;
        }

        @keyframes successPop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .status-COMPLETED {
            background: linear-gradient(135deg, #8B0000, #c41e1e);
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        .status-PENDING {
            background: linear-gradient(135deg, #ff8800, #ffaa00);
            color: white;
            box-shadow: 0 0 20px rgba(255, 136, 0, 0.4);
        }

        .status-FAILED {
            background: linear-gradient(135deg, #4a0000, #660000);
            color: white;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.4);
        }

        .payment-details {
            display: grid;
            gap: 10px;
            color: #b0b0b0;
        }

        .payment-details strong {
            color: #ff6b6b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #888;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 0, 0, 0.3);
            border-top-color: #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Updated: Error box is rounded (10px -> 20px) */
        .error {
            color: #ff6b6b;
            padding: 15px;
            background: rgba(58, 26, 26, 0.8);
            border-radius: 20px; 
            margin: 10px 0;
            border-left: 5px solid #ff0000;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Updated: Stat cards are rounded (15px -> 30px) */
        .stat-card {
            background: rgba(42, 42, 42, 0.8);
            padding: 20px;
            border-radius: 30px; 
            border: 1px solid rgba(139, 0, 0, 0.3);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.4);
        }

        .stat-value {
            font-size: 2.5em;
            color: #ff0000;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            color: #b0b0b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9em;
        }

        @media (min-width: 768px) {
            .payment-list {
                grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-title-container">
            <img id="logo-image" src="spiningLogo.png" alt="Payment Manager Logo">
            <h1>Payment Management System</h1>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('process')">💰 Process Payment</div>
            <div class="tab" onclick="switchTab('all')">📋 All Payments</div>
            <div class="tab" onclick="switchTab('search')">🔍 Search</div>
            <div class="tab" onclick="switchTab('status')">📊 By Status</div>
        </div>

        <div id="process-section" class="section active">
            <div class="card">
                <h2 style="color: #44ff44; margin-bottom: 20px;">Process New Payment</h2>
                <form id="payment-form">
                    <label for="orderId">Order ID *</label>
                    <input id="orderId" type="number" placeholder="e.g., 123" required>

                    <label for="paymentMethod">Payment Method *</label>
                    <select id="paymentMethod" required>
                        <option value="">-- Select Payment Method --</option>
                        <option value="CASH">💵 Cash</option>
                        <option value="CREDIT_CARD">💳 Credit Card</option>
                        <option value="DEBIT_CARD">💳 Debit Card</option>
                        <option value="GCASH">📱 GCash</option>
                        <option value="PAYMAYA">📱 PayMaya</option>
                    </select>

                    <label for="cashierId">Cashier ID *</label>
                    <input id="cashierId" type="number" placeholder="e.g., 1" required value="1">

                    <button type="submit">✨ Process Payment ✨</button>
                </form>
            </div>
        </div>

        <div id="all-section" class="section">
            <div class="stats-grid" id="stats-grid"></div>
            <div class="payment-list" id="all-payments-list">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>

        <div id="search-section" class="section">
            <div class="card">
                <h2 style="color: #44ff44; margin-bottom: 20px;">Search Payment</h2>
                <div style="display: grid; gap: 20px;">
                    <div>
                        <label for="searchPaymentId">Search by Payment ID</label>
                        <input id="searchPaymentId" type="number" placeholder="Enter Payment ID">
                        <button onclick="searchByPaymentId()">🔍 Search Payment</button>
                    </div>
                    <div>
                        <label for="searchOrderId">Search by Order ID</label>
                        <input id="searchOrderId" type="number" placeholder="Enter Order ID">
                        <button onclick="searchByOrderId()">🔍 Search Order</button>
                    </div>
                </div>
            </div>
            <div class="payment-list" id="search-results"></div>
        </div>

        <div id="status-section" class="section">
            <div class="card">
                <h2 style="color: #44ff44; margin-bottom: 20px;">Filter by Status</h2>
                <label for="statusFilter">Payment Status</label>
                <select id="statusFilter" onchange="filterByStatus()">
                    <option value="">-- Select Status --</option>
                    <option value="COMPLETED">✅ Completed</option>
                    <option value="PENDING">⏳ Pending</option>
                    <option value="FAILED">❌ Failed</option>
                </select>
            </div>
            <div class="payment-list" id="status-payments-list"></div>
        </div>
    </div>

    <script>
        const BASE_URL = "http://localhost:8080/api/payments";

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            
            const target = event ? event.target : document.querySelector(`.tab[onclick*="${tab}"]`);

            if (target) {
                target.classList.add('active');
            }
            document.getElementById(`${tab}-section`).classList.add('active');

            if (tab === 'all') loadAllPayments();
        }

        function showNotification(message, isError = false) {
            const notification = document.createElement("div");
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 20px 30px;
                background: ${isError ? 'rgba(196, 30, 30, 0.95)' : 'rgba(0, 139, 0, 0.95)'};
                color: white;
                border-radius: 10px;
                box-shadow: 0 5px 30px rgba(0, 0, 0, 0.5);
                z-index: 1000;
                animation: successPop 0.5s ease-out;
                font-weight: bold;
            `;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        function renderPayment(payment, container) {
            const div = document.createElement("div");
            div.className = "payment-item";
            div.innerHTML = `
                <div class="payment-header">
                    <span class="payment-id">Payment #${payment.id}</span>
                    <span class="status-badge status-${payment.status}">${payment.status}</span>
                </div>
                <div class="payment-details">
                    <p><strong>Order ID:</strong> ${payment.orderId}</p>
                    <p><strong>Amount:</strong> $${payment.amount?.toFixed(2) || 'N/A'}</p>
                    <p><strong>Payment Method:</strong> ${payment.paymentMethod}</p>
                    <p><strong>Cashier ID:</strong> ${payment.cashierId}</p>
                    <p><strong>Date:</strong> ${new Date(payment.paymentDate).toLocaleString()}</p>
                </div>
            `;
            container.appendChild(div);
        }

        async function loadAllPayments() {
            const container = document.getElementById("all-payments-list");
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading payments...</p></div>';

            try {
                const res = await fetch(BASE_URL);
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                
                const payments = await res.json();
                container.innerHTML = "";

                if (payments.length === 0) {
                    container.innerHTML = '<p class="loading">No payments found</p>';
                    return;
                }

                // Calculate stats
                const stats = {
                    total: payments.length,
                    completed: payments.filter(p => p.status === 'COMPLETED').length,
                    pending: payments.filter(p => p.status === 'PENDING').length,
                    failed: payments.filter(p => p.status === 'FAILED').length
                };

                const statsGrid = document.getElementById("stats-grid");
                statsGrid.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-label">Total Payments</div>
                        <div class="stat-value">${stats.total}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Completed</div>
                        <div class="stat-value" style="color: #00ff00">${stats.completed}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Pending</div>
                        <div class="stat-value" style="color: #ffaa00">${stats.pending}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Failed</div>
                        <div class="stat-value" style="color: #ff4444">${stats.failed}</div>
                    </div>
                `;

                payments.forEach((payment, index) => {
                    const div = document.createElement("div");
                    div.className = "payment-item";
                    div.style.animationDelay = `${index * 0.05}s`;
                    renderPayment(payment, container);
                });

            } catch (error) {
                container.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        async function searchByPaymentId() {
            const id = document.getElementById("searchPaymentId").value;
            if (!id) {
                showNotification("Please enter a Payment ID", true);
                return;
            }

            const container = document.getElementById("search-results");
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const res = await fetch(`${BASE_URL}/${id}`);
                if (!res.ok) throw new Error("Payment not found");
                
                const payment = await res.json();
                container.innerHTML = "";
                renderPayment(payment, container);
            } catch (error) {
                container.innerHTML = `<div class="error">❌ ${error.message}</div>`;
            }
        }

        async function searchByOrderId() {
            const id = document.getElementById("searchOrderId").value;
            if (!id) {
                showNotification("Please enter an Order ID", true);
                return;
            }

            const container = document.getElementById("search-results");
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const res = await fetch(`${BASE_URL}/order/${id}`);
                if (!res.ok) throw new Error("Payment not found for this order");
                
                const payment = await res.json();
                container.innerHTML = "";
                renderPayment(payment, container);
            } catch (error) {
                container.innerHTML = `<div class="error">❌ ${error.message}</div>`;
            }
        }

        async function filterByStatus() {
            const status = document.getElementById("statusFilter").value;
            if (!status) return;

            const container = document.getElementById("status-payments-list");
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const res = await fetch(`${BASE_URL}/status?status=${status}`);
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                
                const payments = await res.json();
                container.innerHTML = "";

                if (payments.length === 0) {
                    container.innerHTML = `<p class="loading">No ${status} payments found</p>`;
                    return;
                }

                payments.forEach(payment => renderPayment(payment, container));
            } catch (error) {
                container.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        document.getElementById("payment-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const submitButton = e.target.querySelector('button[type="submit"]');
            submitButton.textContent = "⏳ Processing...";
            submitButton.disabled = true;

            try {
                const data = {
                    orderId: parseInt(document.getElementById("orderId").value),
                    paymentMethod: document.getElementById("paymentMethod").value,
                    cashierId: parseInt(document.getElementById("cashierId").value)
                };

                const res = await fetch(BASE_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.error || "Failed to process payment");
                }

                const payment = await res.json();
                showNotification(`✅ Payment #${payment.id} processed successfully!`);
                document.getElementById("payment-form").reset();
            } catch (error) {
                showNotification(`❌ ${error.message}`, true);
            } finally {
                submitButton.textContent = "✨ Process Payment ✨";
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
